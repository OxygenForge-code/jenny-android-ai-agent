name: Build APK

# `.github/workflows/ci.yml` verifica solo il lato Python: ruff, pyright, pytest.
# Kotlin e Chaquopy non vengono mai compilati lì, quindi un errore in una delle
# due lingue — o un wheel che non si risolve più — si scopre soltanto
# installando l'APK a mano. Questo workflow colma quel buco: a ogni push su
# `main` e a ogni PR costruisce l'APK `foss`, gli fa passare i test JVM e il
# controllo `scripts/check_foss_apk.py`, e lo allega come artifact. Su un tag
# `v*` gli stessi APK finiscono nella release.
#
# Il flavor `play` non si costruisce qui: aggiunge `play-services-auth`, cioè
# una libreria Google, e non è quello che si distribuisce da GitHub.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serve al solo job `release` (creare o aggiornare una release). Sui PR da fork
# GitHub declassa comunque il token a sola lettura.
permissions:
  contents: write

concurrency:
  group: apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: FOSS APK
    runs-on: ubuntu-latest
    # La prima build scarica il runtime Python di Chaquopy, i wheel e l'intera
    # toolchain Gradle: al primo giro sono ~20 minuti. I successivi, con la
    # cache, molto meno. 75 lascia margine senza arrivare al default di 360.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      # JDK 17: AGP 8.7 lo richiede (il wrapper da solo ne accetterebbe anche
      # altri, la toolchain Android no).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy esegue `pip` **sulla macchina di build** per i requirement e
      # per la compilazione dei .pyc, e pretende la stessa major.minor dell'app
      # (qui 3.11, v. `chaquopy` in android/app/build.gradle.kts). Il `python3`
      # dell'immagine ubuntu-latest è troppo nuovo: senza questo passo la build
      # si ferma con "Python 3.11 not found".
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Cache di Gradle (dipendenze + build cache) e, sotto, quella dei pacchetti
      # Chaquopy: senza, ogni giro riscarica il runtime e i wheel da capo.
      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4

      # compileSdk è 34: il runner ha già l'SDK, ma non è detto che abbia
      # esattamente questa piattaforma, e i build-tools vanno allineati ad AGP.
      - name: Install Android SDK 34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts \
            | head -1 | sed -E 's/.*"(.*)"/\1/')
          VERSION_CODE=$(grep -oE 'versionCode = [0-9]+' android/app/build.gradle.kts \
            | head -1 | sed -E 's/.* ([0-9]+)/\1/')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Cannot read versionName/versionCode from android/app/build.gradle.kts" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # Firma opzionale della release: se i secret ci sono, si firma l'APK che
      # si pubblica; se mancano, `assembleFossRelease` produce comunque un APK
      # non firmato (build.gradle.kts lo prevede di proposito). In quel caso
      # resta installabile solo il debug, ed è quello che finisce nella release.
      - name: Prepare release keystore (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: the release APK will be unsigned."
            echo "store_file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STORE"
          echo "store_file=$STORE" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: android
        env:
          # 2 GB (android/gradle.properties) bastano per compilare, non per R8
          # più il daemon Kotlin: sul runner ci sono 16 GB, tanto vale usarli.
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
          # Letti da android/app/build.gradle.kts. Vuoti = nessuna firma.
          JENNY_KEYSTORE_PATH: ${{ steps.signing.outputs.store_file }}
          JENNY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JENNY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JENNY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain --stacktrace \
            :app:testFossDebugUnitTest \
            :app:assembleFossDebug \
            :app:assembleFossRelease

      # Il flavor `foss` promette di non contenere né il codice delle estensioni
      # né librerie Google. Gradle lo garantisce per costruzione; questo lo
      # verifica sull'APK vero, che è quello che si pubblica.
      - name: Check the FOSS build contains no extensions
        run: |
          for apk in android/app/build/outputs/apk/foss/debug/app-foss-debug.apk \
                     android/app/build/outputs/apk/foss/release/*.apk; do
            python3 scripts/check_foss_apk.py "$apk"
          done

      - name: Collect APKs
        id: dist
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BASE="app-foss-${VERSION_NAME}-${SHORT_SHA:0:7}"
          cp android/app/build/outputs/apk/foss/debug/app-foss-debug.apk \
             "dist/${BASE}-debug.apk"
          echo "debug=dist/${BASE}-debug.apk" >> "$GITHUB_OUTPUT"
          # `app-foss-release-unsigned.apk` quando non c'è un keystore: non si
          # installa, quindi non si allega come se fosse quello buono.
          RELEASE_APK=$(ls android/app/build/outputs/apk/foss/release/app-foss-release.apk \
                          2>/dev/null || true)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "dist/${BASE}-release.apk"
            echo "release=dist/${BASE}-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "release=" >> "$GITHUB_OUTPUT"
          fi
          cd dist
          sha256sum ./*.apk | tee SHA256SUMS

      - name: Summary
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          {
            echo "### FOSS APK ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo
            echo "| file | size |"
            echo "| --- | --- |"
            cd dist
            for f in ./*.apk; do
              echo "| \`$f\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: foss-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach APKs to the release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: foss-apk
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          Built from this tag by the `Build APK` workflow.

          * `-debug.apk` is signed with the debug key: it installs on any device
            that allows sideloading, and it is what you want unless you set up
            release signing.
          * `-release.apk` appears only when the `ANDROID_KEYSTORE_*` secrets are
            configured; otherwise the release build is unsigned and is not
            attached.
          * `SHA256SUMS` covers both.

          Unofficial build of a fork. Not affiliated with, or endorsed by, the
          upstream Jenny project.
          EOF
          )
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "$TAG" --notes "$NOTES" --verify-tag
          fi
